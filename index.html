<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>All vetande AI-klon med Lär-läge</title>
<style>
body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
#chat { white-space: pre-line; border: 1px solid #ccc; padding: 10px; height: 400px; overflow-y: scroll; background: #fff; margin-bottom: 10px; }
input { padding: 10px; width: 60%; font-size: 16px; }
button { padding: 10px 20px; font-size: 16px; margin-left: 10px; cursor: pointer; margin-bottom: 10px; }
select { padding: 10px; font-size: 16px; margin-bottom: 10px; width: 100%; }
#learnModeIndicator { margin-left: 10px; font-weight: bold; color: green; }
</style>
</head>
<body>
<h2>All vetande AI-klon (Smart + Lär-läge + Local Storage)</h2>

<select id="aiSelector" multiple>
  <option value="textAI">TextAI</option>
  <option value="codeAI">KodAI</option>
  <option value="creativeAI">KreativAI</option>
  <option value="healthAI">HälsaAI</option>
  <option value="allKnowingAI" selected>All vetande</option>
</select>

<div id="chat"></div>

<input type="text" id="userInput" placeholder="Skriv din fråga..." />
<button onclick="sendMessage()">Skicka</button>
<button onclick="scanForSmartness()">Skanna för smarthet</button>
<button id="learnModeBtn" onclick="toggleLearnMode()">Lär-läge: AV</button>
<span id="learnModeIndicator"></span>

<script>
let chatDiv = document.getElementById("chat");
let userInput = document.getElementById("userInput");
let learnMode = false;

// Läs chat, lär-läge och AI-minne från Local Storage
let memory = JSON.parse(localStorage.getItem("aiMemory") || "[]");

if(localStorage.getItem("chatHistory")) {
    chatDiv.innerHTML = localStorage.getItem("chatHistory");
}
if(localStorage.getItem("learnMode") === "true") {
    learnMode = true;
    document.getElementById("learnModeBtn").innerText = "Lär-läge: PÅ";
    document.getElementById("learnModeIndicator").innerText = "Lär-läge aktiverat";
}

// Spara chat
function saveChat() {
    localStorage.setItem("chatHistory", chatDiv.innerHTML);
}

// Toggle lär-läge
function toggleLearnMode() {
    learnMode = !learnMode;
    document.getElementById("learnModeBtn").innerText = learnMode ? "Lär-läge: PÅ" : "Lär-läge: AV";
    document.getElementById("learnModeIndicator").innerText = learnMode ? "Lär-läge aktiverat" : "";
    localStorage.setItem("learnMode", learnMode);
}

// Skicka meddelande
function sendMessage() {
    let msg = userInput.value;
    if(msg.trim() === "") return;
    appendChat("Du: " + msg);
    let response = generateResponse(msg);
    appendChat("All vetande AI: " + response);
    userInput.value = "";
}

// Append till chat och spara
function appendChat(text) {
    chatDiv.innerHTML += text + "\n\n";
    chatDiv.scrollTop = chatDiv.scrollHeight;
    saveChat();
}

// Generera svar med minne
function generateResponse(input) {
    // Leta efter tidigare liknande frågor i minnet
    let found = memory.find(item => item.question.toLowerCase() === input.toLowerCase());
    if(found) {
        return "Jag minns detta: " + found.answer;
    }

    // Om inget minne, skapa generiskt svar
    let genericAnswer = "Jag har lärt mig om '" + input + "' och kan ge svar här. (Exempel-svar)";

    // Lär-läge: spara input och svar i minnet
    if(learnMode) {
        memory.push({question: input, answer: genericAnswer});
        localStorage.setItem("aiMemory", JSON.stringify(memory));
    }

    return genericAnswer;
}

// Skanna för smarthet (placeholder)
function scanForSmartness() {
    appendChat("Skannar internet för smarthet... (detta är en demo, ingen riktig sökning utförs)");
}
</script>
</body>
</html>
