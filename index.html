<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>All Vetande AI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        #chatBox { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; background: #fff; }
        input, button { margin: 5px 0; padding: 5px; }
        hr { margin: 20px 0; }
    </style>
</head>
<body>
    <h1>All Vetande AI</h1>
    
    <div id="chatBox"></div>
    <input type="text" id="msgInput" placeholder="Skriv meddelande här">
    <button id="sendBtn">Skicka</button>
    
    <hr>
    <h2>Extra AI-Funktioner</h2>

    <!-- Definiera -->
    <input type="text" id="defineInput" placeholder="Skriv ord/begrepp här">
    <button id="defineBtn">Definiera</button>
    <br>
    
    <!-- Skriv historia -->
    <input type="text" id="storyInput" placeholder="Skriv ämne/förslag för historia">
    <button id="storyBtn">Skriv Historia</button>
    <br>

    <!-- Skanna och Deep Search -->
    <button id="scanBtn">Skanna för smarthet</button>
    <button id="deepSearchBtn">Djup skanning (en webb per gång)</button>

<script>
// ===== MEMORY OCH PERSONALITET =====
let memory = JSON.parse(localStorage.getItem('AI_Memory')) || {};
let currentPersonality = 'All Vetande';
if (!memory[currentPersonality]) memory[currentPersonality] = {messages: [], Definitions: {}, Stories: {}};

function saveMemory() {
    localStorage.setItem('AI_Memory', JSON.stringify(memory));
}

function displayMessage(sender, message) {
    const chatBox = document.getElementById('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.innerHTML = `<strong>${sender}:</strong> ${message}`;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ===== LÄRA SIG FRÅN ALLT =====
function learnFromMessage(message) {
    memory[currentPersonality].messages.push(message);
    saveMemory();
}

// ===== AUTOMATISKA HISTORIER =====
function processMessageAutomatically(message) {
    const lowerMsg = message.toLowerCase();
    if (lowerMsg.includes("berätta") || lowerMsg.includes("skriv") || lowerMsg.includes("historia") || lowerMsg.includes("story")) {
        const topic = message;
        const story = `Historia om "${topic}": En berättelse baserad på AI-lärande från dina tidigare meddelanden.`;
        memory[currentPersonality]['Stories'][topic] = story;
        saveMemory();
        displayMessage(currentPersonality, story);
    }
}

// ===== CHATT =====
document.getElementById('sendBtn').onclick = () => {
    const msgInput = document.getElementById('msgInput');
    const msg = msgInput.value.trim();
    if (!msg) return;

    displayMessage('Du', msg);
    learnFromMessage(msg);
    processMessageAutomatically(msg);
    msgInput.value = '';

    const aiReply = `AI svar baserat på tidigare meddelanden: "${msg}" (simulerat svar)`;
    displayMessage(currentPersonality, aiReply);
    learnFromMessage(aiReply);
};

// ===== DEFINIERA =====
document.getElementById('defineBtn').onclick = () => {
    const term = document.getElementById('defineInput').value.trim();
    if (!term) return;
    const definition = `Definition av "${term}": Simulerad förklaring baserad på AI-lärande.`;
    memory[currentPersonality]['Definitions'][term] = definition;
    saveMemory();
    displayMessage(currentPersonality, definition);
    document.getElementById('defineInput').value = '';
};

// ===== SKRIV HISTORIA =====
document.getElementById('storyBtn').onclick = () => {
    const topic = document.getElementById('storyInput').value.trim();
    if (!topic) return;
    const story = `Historia om "${topic}": En simulerad berättelse baserad på AI-lärande.`;
    memory[currentPersonality]['Stories'][topic] = story;
    saveMemory();
    displayMessage(currentPersonality, story);
    document.getElementById('storyInput').value = '';
};

// ===== SKANNA FÖR SMARTHET =====
document.getElementById('scanBtn').onclick = () => {
    displayMessage(currentPersonality, "Skanning pågår... Simulerar inlärning från internet (kan ta tid)...");
    setTimeout(() => {
        displayMessage(currentPersonality, "Skanning klar. AI har lärt sig nya koncept baserat på simulering.");
    }, 3000); // simulerad delay
};

// ===== DJUP SKANNING =====
document.getElementById('deepSearchBtn').onclick = () => {
    displayMessage(currentPersonality, "Djup skanning pågår... Skannar en webbplats i taget (simulerad)...");
    setTimeout(() => {
        displayMessage(currentPersonality, "Djup skanning klar. AI har analyserat sidan.");
    }, 3000);
};
</script>
</body>
</html>
