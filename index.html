<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>All Vetande AI – Självlärande</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        #chatBox { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; background: #fff; }
        input, button, select { margin: 5px 0; padding: 5px; }
        hr { margin: 20px 0; }
        .aiReply { margin-top: 2px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>All Vetande AI – Självlärande</h1>
    
    <div id="chatBox"></div>
    <input type="text" id="msgInput" placeholder="Skriv meddelande här">
    <button id="sendBtn">Skicka</button>
    
    <hr>
    <h2>Extra AI-Funktioner</h2>
    <input type="text" id="defineInput" placeholder="Skriv ord/begrepp här">
    <button id="defineBtn">Definiera</button><br>
    <input type="text" id="storyInput" placeholder="Skriv ämne/förslag för historia">
    <button id="storyBtn">Skriv Historia</button><br>
    <button id="scanBtn">Skanna för smarthet</button>
    <button id="deepSearchBtn">Djup skanning (en webb per gång)</button>

<script>
// ===== MEMORY OCH PERSONALITET =====
let memory = JSON.parse(localStorage.getItem('AI_Memory')) || {};
let currentPersonality = 'All Vetande';
if (!memory[currentPersonality]) memory[currentPersonality] = {messages: [], Definitions: {}, Stories: {}, RatedReplies: []};

function saveMemory() { localStorage.setItem('AI_Memory', JSON.stringify(memory)); }
function displayMessage(sender, message, id=null) {
    const chatBox = document.getElementById('chatBox');
    const msgDiv = document.createElement('div');
    msgDiv.innerHTML = `<strong>${sender}:</strong> <span>${message}</span>`;
    if(id) {
        const select = document.createElement('select');
        select.innerHTML = `<option value="">Bedöm AI-svar</option>
                            <option value="1">1 – Dåligt</option>
                            <option value="2">2 – Ok</option>
                            <option value="3">3 – Bra</option>
                            <option value="4">4 – Mycket bra</option>
                            <option value="5">5 – Perfekt</option>`;
        select.onchange = () => {
            let rating = parseInt(select.value);
            memory[currentPersonality].RatedReplies.push({id, rating, message});
            saveMemory();
            select.disabled = true;
        };
        msgDiv.appendChild(select);
    }
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// ===== LÄRA SIG FRÅN ALLT =====
function learnFromMessage(message) {
    memory[currentPersonality].messages.push(message);
    saveMemory();
}

// ===== SMARTARE SVAR MED BEDÖMNINGAR =====
function generateSmartReply(userMessage) {
    // Samla tidigare högpoängade svar
    const goodReplies = memory[currentPersonality].RatedReplies
                        .filter(r => r.rating >= 4)
                        .map(r => r.message)
                        .join(' ');
    
    let combinedMemory = memory[currentPersonality].messages.join(' ');
    let definitions = Object.keys(memory[currentPersonality].Definitions).map(k => `${k}: ${memory[currentPersonality].Definitions[k]}`).join('. ');
    let stories = Object.keys(memory[currentPersonality].Stories).map(k => `${k}: ${memory[currentPersonality].Stories[k]}`).join('. ');

    let reply = `Utifrån min inlärning: "${userMessage}"\n`;
    if (definitions) reply += `Kända definitioner: ${definitions}\n`;
    if (stories) reply += `Tidigare historier: ${stories}\n`;
    if (goodReplies) reply += `Tidigare högpoängade svar som referens: ${goodReplies.slice(-200)}\n`;
    reply += `Övriga meddelanden jag minns: ${combinedMemory.slice(-200)}...`; 
    return reply;
}

// ===== AUTOMATISKA HISTORIER =====
function processMessageAutomatically(message) {
    const lowerMsg = message.toLowerCase();
    if (lowerMsg.includes("berätta") || lowerMsg.includes("skriv") || lowerMsg.includes("historia") || lowerMsg.includes("story")) {
        const topic = message;
        const story = `Historia om "${topic}": En berättelse baserad på AI-lärande från dina tidigare meddelanden.`;
        memory[currentPersonality]['Stories'][topic] = story;
        saveMemory();
        displayMessage(currentPersonality, story);
    }
}

// ===== CHATT =====
document.getElementById('sendBtn').onclick = () => {
    const msgInput = document.getElementById('msgInput');
    const msg = msgInput.value.trim();
    if (!msg) return;

    displayMessage('Du', msg);
    learnFromMessage(msg);
    processMessageAutomatically(msg);
    msgInput.value = '';

    const aiReply = generateSmartReply(msg);
    const replyID = Date.now(); // unikt id
    displayMessage(currentPersonality, aiReply, replyID);
    learnFromMessage(aiReply);
};

// ===== DEFINIERA =====
document.getElementById('defineBtn').onclick = () => {
    const term = document.getElementById('defineInput').value.trim();
    if (!term) return;
    const definition = `Definition av "${term}": Simulerad förklaring baserat på allt AI har lärt sig.`;
    memory[currentPersonality]['Definitions'][term] = definition;
    saveMemory();
    displayMessage(currentPersonality, definition);
    document.getElementById('defineInput').value = '';
};

// ===== SKRIV HISTORIA =====
document.getElementById('storyBtn').onclick = () => {
    const topic = document.getElementById('storyInput').value.trim();
    if (!topic) return;
    const story = `Historia om "${topic}": En simulerad berättelse baserad på allt AI har lärt sig.`;
    memory[currentPersonality]['Stories'][topic] = story;
    saveMemory();
    displayMessage(currentPersonality, story);
    document.getElementById('storyInput').value = '';
};

// ===== SKANNA FÖR SMARTHET =====
document.getElementById('scanBtn').onclick = () => {
    displayMessage(currentPersonality, "Skanning pågår... Simulerar inlärning från internet och dina meddelanden...");
    setTimeout(() => {
        displayMessage(currentPersonality, "Skanning klar. AI har uppdaterat sin kunskap baserat på allt tillgängligt (simulerat).");
    }, 4000);
};

// ===== DJUP SKANNING =====
document.getElementById('deepSearchBtn').onclick = () => {
    displayMessage(currentPersonality, "Djup skanning pågår... Skannar en webbplats i taget (simulerad)...");
    setTimeout(() => {
        displayMessage(currentPersonality, "Djup skanning klar. AI har analyserat sidan och uppdaterat sin kunskap.");
    }, 4000);
};
</script>
</body>
</html>
