<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>All Vetande AI</title>
<style>
body { font-family: Arial, sans-serif; margin: 20px; }
#chat { width: 100%; height: 300px; border: 1px solid #ccc; padding: 10px; overflow-y: scroll; white-space: pre-wrap; background:#f9f9f9;}
#progressContainer { width: 100%; background: #ddd; height: 25px; display: none; margin-top: 10px; }
#progressBar { width: 0%; height: 100%; background: #4caf50; text-align:center; color:white; }
</style>
</head>
<body>

<h1>All Vetande AI</h1>

<div>
<label for="sourceType">Källa:</label>
<select id="sourceType">
  <option value="wikipedia">Wikipedia</option>
  <option value="book">Bok (URL)</option>
</select>
<input type="text" id="sourceInput" placeholder="Titel eller URL">
<button onclick="addSource()">Lägg till källa</button>
<button onclick="scanAllSources()">Skanna alla källor i kön</button>
</div>

<div id="progressContainer">
  <div id="progressBar">0%</div>
</div>

<h2>Chat</h2>
<div id="chat"></div>

<script>
// Globala variabler
let memory = JSON.parse(localStorage.getItem("aiMemory") || "[]");
let sourcesQueue = [];
document.getElementById("chat").innerHTML = localStorage.getItem("chatHistory") || "";

// Lägg till källa i kön
function addSource() {
    let type = document.getElementById("sourceType").value;
    let input = document.getElementById("sourceInput").value.trim();
    if(!input) { appendChat("Ange titel eller URL för källan."); return; }

    let src = {type, query: type==="wikipedia"?input:null, url:type==="book"?input:null};
    sourcesQueue.push(src);
    document.getElementById("sourceInput").value="";
    appendChat("Källa lagd i kö: " + (src.query || src.url));
}

// Starta kö-skanning
function scanAllSources() {
    if(sourcesQueue.length===0){ appendChat("Ingen källa i kön att skanna."); return; }
    appendChat("Startar skanning av alla källor...");
    scanNextSource();
}

// Skannar nästa källa i kön
async function scanNextSource() {
    if(sourcesQueue.length===0){ appendChat("Alla källor har skannats."); return; }
    let src = sourcesQueue.shift();
    await scanSourceProgressively(src);
    scanNextSource(); // nästa källa
}

// Progressiv skanning stycke för stycke
async function scanSourceProgressively(src) {
    appendChat("Skannar: " + (src.query || src.url));
    let progressContainer = document.getElementById("progressContainer");
    let progressBar = document.getElementById("progressBar");
    progressContainer.style.display="block";

    try {
        let text="";
        if(src.type==="wikipedia") {
            let response = await fetch(`https://sv.wikipedia.org/w/api.php?origin=*&action=query&prop=extracts&format=json&explaintext=&titles=${encodeURIComponent(src.query)}`);
            let data = await response.json();
            let pages = data.query.pages;
            for(let key in pages) text = pages[key].extract || "";
        } else if(src.type==="book") {
            let response = await fetch(src.url);
            text = await response.text();
        }

        let paragraphs = text.split("\n\n").filter(p => p.trim()!=="");
        for(let i=0;i<paragraphs.length;i++){
            memory.push({source: src.query || src.url, content: paragraphs[i]});
            localStorage.setItem("aiMemory", JSON.stringify(memory));

            let progressPercent = Math.round(((i+1)/paragraphs.length)*100);
            progressBar.style.width = progressPercent+"%";
            progressBar.innerText = progressPercent+"%";

            await new Promise(resolve => setTimeout(resolve,50));
        }
        appendChat("Skanning klar: " + (src.query || src.url));
    } catch(err) {
        appendChat("Fel vid skanning: " + err);
    }
    setTimeout(()=>progressContainer.style.display="none",1000);
}

// Chat-funktion
function appendChat(text){
    let chatDiv = document.getElementById("chat");
    chatDiv.innerHTML += text + "\n\n";
    chatDiv.scrollTop = chatDiv.scrollHeight;
    localStorage.setItem("chatHistory", chatDiv.innerHTML);
}
</script>
</body>
</html>
