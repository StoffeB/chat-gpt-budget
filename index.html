<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Vetande AI</title>
<style>
  body { font-family: Arial, sans-serif; padding: 20px; background:#f4f4f4; }
  #chat { border:1px solid #ccc; padding:10px; height:300px; overflow-y:auto; background:white; margin-bottom:10px; }
  #userInput { width:70%; padding:5px; }
  button { padding:5px 10px; margin-left:5px; margin-top:5px; }
  #progressContainer, #deepProgressContainer { width:100%; background:#ddd; margin-top:10px; height:20px; }
  #progressBar { width:0%; height:100%; background:#4caf50; }
  #deepProgressBar { width:0%; height:100%; background:#2196F3; }
</style>
</head>
<body>

<h1>All Vetande AI</h1>

<label for="personalitySelect">Välj personlighet:</label>
<select id="personalitySelect">
  <option value="allVetande">All Vetande</option>
  <option value="kreativ">Kreativ</option>
  <option value="programmerare">Programmerare</option>
</select>

<div id="chat"></div>

<input type="text" id="userInput" placeholder="Skriv din fråga här">
<button id="sendBtn">Skicka</button>

<hr>
<h2>Full Web Scan</h2>
<button id="fullWebScanBtn">Starta Full Web Scan</button>
<button id="pauseScanBtn">Pausa</button>
<button id="resumeScanBtn">Fortsätt</button>
<div id="progressContainer"><div id="progressBar"></div></div>

<hr>
<h2>Djup Skanning</h2>
<button id="deepScanBtn">Starta Djup Skanning</button>
<button id="pauseDeepScanBtn">Pausa</button>
<button id="resumeDeepScanBtn">Fortsätt</button>
<div id="deepProgressContainer"><div id="deepProgressBar"></div></div>

<script>
let memory = JSON.parse(localStorage.getItem('AI_Memory')) || { allVetande:{}, kreativ:{}, programmerare:{} };
let scanning = false;
let fullScanProgress = 0;
let fullScanInterval = null;
let scanPaused = false;
let currentPersonality = document.getElementById('personalitySelect').value;

let deepScanProgress = 0;
let deepScanInterval = null;
let deepScanPaused = false;

document.getElementById('personalitySelect').onchange = e => {
  currentPersonality = e.target.value;
  displayMessage('System','Bytte till personlighet: '+currentPersonality);
}

document.getElementById('sendBtn').onclick = ()=> {
  const input = document.getElementById('userInput').value;
  if(input.trim()==='') return;
  displayMessage('Du', input);
  respond(input);
  document.getElementById('userInput').value = '';
}

function displayMessage(sender,text){
  const chat = document.getElementById('chat');
  chat.innerHTML += `<b>${sender}:</b> ${text}<br>`;
  chat.scrollTop = chat.scrollHeight;
}

function respond(input){
  let knowledge = memory[currentPersonality];
  let known = Object.values(knowledge).find(k => input.includes(k.lastResponse));
  let response = known ? `Jag minns detta: ${known.lastResponse}` : `Simulerad svar på: "${input}"`;
  
  knowledge['Q'+Date.now()] = { input, lastResponse: response };
  saveMemory();
  
  displayMessage(currentPersonality, response);
}

function saveMemory(){
  localStorage.setItem('AI_Memory', JSON.stringify(memory));
}

// Full Web Scan
document.getElementById('fullWebScanBtn').onclick = startFullWebScan;
document.getElementById('pauseScanBtn').onclick = () => { scanPaused = true; displayMessage('System','Full Web Scan pausad'); };
document.getElementById('resumeScanBtn').onclick = () => { scanPaused = false; displayMessage('System','Full Web Scan fortsätter'); };

function startFullWebScan() {
  if(scanning) return;
  scanning = true;
  fullScanProgress = 0;
  scanPaused = false;
  displayMessage('System','Full Web Scan startad!');
  const progressBar = document.getElementById('progressBar');

  fullScanInterval = setInterval(()=>{
    if(scanPaused) return;
    fullScanProgress++;
    progressBar.style.width = fullScanProgress + '%';
    displayMessage('System',`Full Web Scan progress: ${fullScanProgress}%`);

    memory[currentPersonality][`WebData${fullScanProgress}`] = {
      count:1,
      lastResponse:`Simulerad webblärning steg ${fullScanProgress}`
    };
    saveMemory();

    if(fullScanProgress>=100){
      clearInterval(fullScanInterval);
      scanning=false;
      progressBar.style.width='0%';
      displayMessage('System','Full Web Scan klar!');
    }
  }, 500);
}

// Djup Skanning
document.getElementById('deepScanBtn').onclick = startDeepScan;
document.getElementById('pauseDeepScanBtn').onclick = () => { deepScanPaused = true; displayMessage('System','Djup Skanning pausad'); };
document.getElementById('resumeDeepScanBtn').onclick = () => { deepScanPaused = false; displayMessage('System','Djup Skanning fortsätter'); };

function startDeepScan(){
  if(scanning) return;
  scanning = true;
  deepScanProgress = 0;
  deepScanPaused = false;
  displayMessage('System','Djup Skanning startad!');
  const deepProgressBar = document.getElementById('deepProgressBar');

  deepScanInterval = setInterval(()=>{
    if(deepScanPaused) return;
    deepScanProgress++;
    deepProgressBar.style.width = deepScanProgress + '%';
    displayMessage('System',`Djup Skanning progress: ${deepScanProgress}%`);

    memory[currentPersonality][`DeepWebData${deepScanProgress}`] = {
      count:1,
      lastResponse:`Simulerad djup webblärning steg ${deepScanProgress}`
    };
    saveMemory();

    if(deepScanProgress>=100){
      clearInterval(deepScanInterval);
      scanning=false;
      deepProgressBar.style.width='0%';
      displayMessage('System','Djup Skanning klar!');
    }
  }, 1000);
}
</script>

</body>
</html>
