<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>AI Skanner</title>
<style>
body { font-family: Arial; margin:20px; background:#f0f0f0; }
#chat { border:1px solid #ccc; padding:10px; height:300px; overflow-y:auto; background:white; }
button { margin:5px; padding:10px; }
#progressContainer { width:100%; background:#ddd; height:20px; margin-top:10px; }
#progressBar { width:0%; height:100%; background:green; }
</style>
</head>
<body>

<h1>AI Skanner</h1>

<div id="chat"></div>

<input type="text" id="userInput" placeholder="Skriv något...">
<button onclick="sendMessage()">Skicka</button><br>

<button id="scanBtn">Skanna för smarthet</button>
<button id="deepScanBtn">Djup skanning</button>

<div id="progressContainer">
  <div id="progressBar"></div>
</div>

<script>
let memory = {general:{}}; // AI memory
let scanning = false;

loadMemory();
displayMessage('System', 'AI startad. Välj personlighet: All Vetande.');

// Skicka meddelande
function sendMessage() {
  const input = document.getElementById('userInput').value;
  if(!input) return;
  displayMessage('Du', input);
  respond(input);
  document.getElementById('userInput').value='';
}

// Visa meddelande i chat
function displayMessage(sender,text){
  const chat = document.getElementById('chat');
  chat.innerHTML += `<b>${sender}:</b> ${text}<br>`;
  chat.scrollTop = chat.scrollHeight;
}

// AI svar (simulerat)
function respond(input){
  let response = memory.general[input] ? memory.general[input].lastResponse : "Jag vet inte, men jag lär mig!";
  displayMessage('All Vetande', response);
  // Lägg till input i memory
  memory.general[input]={count:1,lastResponse:response};
  saveMemory();
}

// Spara memory i LocalStorage
function saveMemory(){ localStorage.setItem('aiMemory', JSON.stringify(memory)); }
function loadMemory(){
  const saved = localStorage.getItem('aiMemory');
  if(saved) memory = JSON.parse(saved);
}

// Skanna för smarthet
document.getElementById('scanBtn').onclick = scanForSmartness;

function scanForSmartness() {
  if(scanning) return;
  scanning = true;
  displayMessage('System', 'Skanning startad...');
  const progressBar = document.getElementById('progressBar');
  
  const simulatedKnowledge = [
    'Fysik: Newtons lagar',
    'Historia: Vikingatiden',
    'Matematik: Pythagoras sats',
    'Programmering: Loops och funktioner',
    'Kreativ: Magiska berättelser'
  ];
  
  simulatedKnowledge.forEach(k=>{
    memory.general[k] = {count:1, lastResponse:`Simulerad kunskap: ${k}`};
  });
  saveMemory();
  progressBar.style.width = '100%';
  
  setTimeout(()=>{
    displayMessage('System','Skanning slutförd. AI har lärt sig nya koncept!');
    scanning=false;
    progressBar.style.width='0%';
  }, 500);
}

// Djup skanning (simulerad)
document.getElementById('deepScanBtn').onclick = deepScan;

function deepScan() {
  if(scanning) return;
  scanning = true;
  displayMessage('System','Djup skanning startad. Detta kan ta tid...');
  const progressBar = document.getElementById('progressBar');
  let progress=0;
  const interval = setInterval(()=>{
    progress += 5;
    progressBar.style.width = progress+'%';
    displayMessage('System',`Djup skanning: ${progress}%`);
    if(progress>=100){
      clearInterval(interval);
      displayMessage('System','Djup skanning klar! AI har simulerat att den lärt sig webbdata.');
      scanning=false;
      progressBar.style.width='0%';
    }
  }, 300); // ökar långsamt för att simulera "lång skanning"
}

</script>

</body>
</html>
